name: release-nightly

on:
  push:
    branches: [main, release/v*]
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push container images'
        type: boolean
        required: false
        default: true
      push_binaries:
        description: 'Push binaries to R2'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  nightly-binary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # fetch all commits instead of only the last as some branches are long lived and could have many between versions
      # fetch all tags to ensure that "git describe" reports expected Gitea version, eg. v1.21.0-dev-1-g1234567
      - run: git fetch --unshallow --quiet --tags --force
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: ./.github/actions/node-setup
      - run: make deps-frontend deps-backend
      - run: make release
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check GPG secrets
        id: gpgcheck
        env:
          GPGSIGN_KEY: ${{ secrets.GPGSIGN_KEY }}
          GPGSIGN_PASSPHRASE: ${{ secrets.GPGSIGN_PASSPHRASE }}
        run: |
          if [ -n "$GPGSIGN_KEY" ] && [ -n "$GPGSIGN_PASSPHRASE" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
      - name: import gpg key
        id: import_gpg
        if: steps.gpgcheck.outputs.has == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPGSIGN_KEY }}
          passphrase: ${{ secrets.GPGSIGN_PASSPHRASE }}
      - name: sign binaries
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint || '' }}
          GPG_PASSPHRASE: ${{ secrets.GPGSIGN_PASSPHRASE }}
          HAS_GPG: ${{ steps.gpgcheck.outputs.has }}
        run: |
          for f in dist/release/*; do
            cosign sign-blob "$f" --bundle "$f.sigstore.json" --yes
            if [ "$HAS_GPG" = "true" ] && [ -n "${GPG_FINGERPRINT}" ] && [ -n "${GPG_PASSPHRASE}" ]; then
              echo "$GPG_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --batch --yes --detach-sign -u "$GPG_FINGERPRINT" --output "$f.asc" "$f"
            fi
          done
      # clean branch name to get the folder name in the object storage
      - name: Get cleaned branch name
        id: clean_name
        env:
          REF: ${{ github.ref }}
        run: |
          REF_NAME=$(echo "$REF" | sed -e 's/refs\/heads\///' -e 's/refs\/tags\///' -e 's/release\/v//')
          echo "Cleaned name is ${REF_NAME}"
          echo "branch=${REF_NAME}-nightly" >> "$GITHUB_OUTPUT"
      - name: upload binaries to cloudflare r2
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_binaries }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          BRANCH: ${{ steps.clean_name.outputs.branch }}
        run: |
          aws s3 sync dist/release "s3://$CLOUDFLARE_R2_BUCKET/gitea/$BRANCH" --endpoint-url "https://$CLOUDFLARE_R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress

  nightly-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # to publish to ghcr.io
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'gitea/gitea' }}
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE || 'ghcr.io/go-gitea/gitea' }}
      CUSTOM_REGISTRY: ${{ vars.CUSTOM_REGISTRY || '' }}
      CUSTOM_IMAGE: ${{ vars.CUSTOM_IMAGE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: git fetch --unshallow --quiet --tags --force
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Get cleaned branch name
        id: clean_name
        env:
          REF: ${{ github.ref }}
        run: |
          REF_NAME=$(echo "$REF" | sed -e 's/refs\/heads\///' -e 's/refs\/tags\///' -e 's/release\/v//')
          echo "branch=${REF_NAME}-nightly" >> "$GITHUB_OUTPUT"
      - name: Build images list
        id: images
        env:
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          CUSTOM_REGISTRY: ${{ env.CUSTOM_REGISTRY }}
          CUSTOM_IMAGE: ${{ env.CUSTOM_IMAGE }}
        run: |
          images=""
          if [ -n "$DOCKERHUB_IMAGE" ]; then
            images="$images$DOCKERHUB_IMAGE"$'\n'
          fi
          if [ -n "$GHCR_IMAGE" ]; then
            images="$images$GHCR_IMAGE"$'\n'
          fi
          if [ -n "$CUSTOM_REGISTRY" ]; then
            if [ -n "$CUSTOM_IMAGE" ]; then
              images="$images$CUSTOM_REGISTRY/$CUSTOM_IMAGE"$'\n'
            else
              images="$images$CUSTOM_REGISTRY"$'\n'
            fi
          fi
          # remove trailing empty lines
          images=$(echo "$images" | sed '/^[[:space:]]*$/d')
          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$images" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=${{ steps.clean_name.outputs.branch }}
          annotations: |
            org.opencontainers.image.authors="maintainers@gitea.io"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta_rootless
        with:
          images: ${{ steps.images.outputs.list }}
          flavor: |
            suffix=-rootless
          tags: |
            type=raw,value=${{ steps.clean_name.outputs.branch }}
          annotations: |
            org.opencontainers.image.authors="maintainers@gitea.io"
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_IMAGE != '' && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR using PAT
        if: ${{ env.GHCR_IMAGE != '' && contains(env.GHCR_IMAGE, 'ghcr.io') && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to custom registry
        if: ${{ env.CUSTOM_REGISTRY != '' && (github.event_name != 'workflow_dispatch' || inputs.push_images) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CUSTOM_REGISTRY }}
          username: ${{ secrets.CUSTOM_REGISTRY_USERNAME || secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.CUSTOM_REGISTRY_PASSWORD || secrets.DOCKERHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build regular docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-rootful
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-rootful,mode=max
      - name: build rootless docker image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          file: Dockerfile.rootless
          tags: ${{ steps.meta_rootless.outputs.tags }}
          annotations: ${{ steps.meta_rootless.outputs.annotations }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-rootless
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache-rootless,mode=max
